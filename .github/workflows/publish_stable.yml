name: Publish stable

on:
  push:
    # Tag form: <version>-<channel>, e.g. 0.1.14-stable
    tags:
      - '*-stable'

jobs:
  publish_stable:
    permissions:
      contents: write

    runs-on: ubuntu-24.04

    steps:
      - name: Set info
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${TAG%-*}" >> $GITHUB_ENV
          echo "CHANNEL=${TAG##*-}" >> $GITHUB_ENV

      - name: Check gh auth
        run: gh auth status
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN || github.token }}

      # The build workflows create the release as a draft, which nobody but a
      # collaborator can see. This job flips it to published once the proven
      # formats are all attached.
      #
      # Flatpak is deliberately not in the required list: it is experimental and
      # a failure there must not hold back the formats that do work.
      - name: Wait for the required assets
        run: |
          REQUIRED="
          wireguard-gui_amd64.deb
          wireguard-gui_amd64.rpm
          wireguard-gui_amd64.AppImage
          wireguard-gui_amd64.snap
          wireguard-gui_arm64.deb
          wireguard-gui_aarch64.rpm
          wireguard-gui_aarch64.AppImage
          wireguard-gui_arm64.snap
          "

          for attempt in $(seq 1 90); do
            present=$(gh release view "$VERSION-$CHANNEL" --json assets \
              -q '.assets[].name' 2>/dev/null || true)

            missing=""
            for asset in $REQUIRED; do
              printf '%s\n' "$present" | grep -qx "$asset" || missing="$missing $asset"
            done

            if [ -z "$missing" ]; then
              echo "All required assets present after $attempt attempt(s)."
              exit 0
            fi

            echo "Attempt $attempt still missing:$missing"
            sleep 40
          done

          echo "::error::Timed out waiting for:$missing"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN || github.token }}

      - name: Publish the release
        run: |
          gh release edit "$VERSION-$CHANNEL" --draft=false --latest
          echo "Published $VERSION-$CHANNEL"
          gh release view "$VERSION-$CHANNEL" --json assets -q '.assets[].name' \
            | sed 's/^/  /'
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN || github.token }}

      # Flatpak may still be building, or may have failed. Either way the
      # release is already out; say so rather than failing the job.
      - name: Report optional assets
        if: always()
        run: |
          present=$(gh release view "$VERSION-$CHANNEL" --json assets \
            -q '.assets[].name' 2>/dev/null || true)
          for asset in wireguard-gui_x86_64.flatpak wireguard-gui_aarch64.flatpak; do
            if printf '%s\n' "$present" | grep -qx "$asset"; then
              echo "optional asset present: $asset"
            else
              echo "::warning::optional asset absent: $asset (flatpak is experimental)"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN || github.token }}
