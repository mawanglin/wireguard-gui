name: Publish stable

on:
  push:
    # Tag form: <version>-<channel>, e.g. 0.1.14-stable
    tags:
      - '*-stable'

jobs:
  publish_stable:
    permissions:
      contents: write

    runs-on: ubuntu-24.04

    env:
      GH_TOKEN: ${{ secrets.CI_TOKEN || github.token }}
      # Lets gh resolve {owner}/{repo} without a checkout.
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Set info
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Check gh auth
        run: gh auth status

      # A draft release carries no real tag association, so looking it up by tag
      # is unreliable. Listing releases and matching on tag_name works for both
      # drafts and published releases.
      #
      # The build workflows create the release as a draft, which nobody but a
      # collaborator can see. This waits for the proven formats and then makes
      # it visible.
      #
      # Flatpak is deliberately not required: it is experimental, and a failure
      # there must not hold back the formats that do work.
      - name: Wait for the required assets
        run: |
          REQUIRED="
          wireguard-gui_amd64.deb
          wireguard-gui_amd64.rpm
          wireguard-gui_amd64.AppImage
          wireguard-gui_amd64.snap
          wireguard-gui_arm64.deb
          wireguard-gui_aarch64.rpm
          wireguard-gui_aarch64.AppImage
          wireguard-gui_arm64.snap
          "

          for attempt in $(seq 1 60); do
            present=$(gh api "repos/{owner}/{repo}/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | .assets[].name")

            missing=""
            for asset in $REQUIRED; do
              printf '%s\n' "$present" | grep -qx "$asset" || missing="$missing $asset"
            done

            if [ -z "$missing" ]; then
              echo "All required assets present after $attempt attempt(s)."
              exit 0
            fi

            echo "Attempt $attempt still missing:$missing"
            sleep 40
          done

          echo "::error::Timed out waiting for:$missing"
          exit 1

      - name: Publish the release
        run: |
          id=$(gh api "repos/{owner}/{repo}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [ -z "$id" ]; then
            echo "::error::No release found for tag $TAG"
            exit 1
          fi
          gh api -X PATCH "repos/{owner}/{repo}/releases/$id" \
            -F draft=false -f make_latest=true > /dev/null
          echo "Published $TAG:"
          gh api "repos/{owner}/{repo}/releases/$id" --jq '.assets[].name' \
            | sed 's/^/  /'

      # Flatpak may still be building, or may have failed. The release is out
      # either way, so report rather than fail.
      - name: Report optional assets
        if: always()
        run: |
          present=$(gh api "repos/{owner}/{repo}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .assets[].name" || true)
          for asset in wireguard-gui_x86_64.flatpak wireguard-gui_aarch64.flatpak; do
            if printf '%s\n' "$present" | grep -qx "$asset"; then
              echo "optional asset present: $asset"
            else
              echo "::warning::optional asset absent: $asset (flatpak is experimental)"
            fi
          done
