name: Draft stable Flatpak

on:
  push:
    # Tag form: <version>-<channel>, e.g. 0.1.13-stable
    tags:
      - '*-stable'
  # The deb is downloaded rather than rebuilt, so this can be re-run on its own
  # while iterating on the manifest without paying for a full release build.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package, e.g. 0.1.13'
        required: true

jobs:
  draft_stable_flatpak:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            deb_arch: arm64

    runs-on: ${{ matrix.runner }}

    env:
      GH_TOKEN: ${{ secrets.CI_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v7

      # The asset name is the file name tauri produced, which carries the
      # version. The '#name' suffix used when uploading sets the asset *label*,
      # not its name, so matching on the unversioned form finds nothing.
      - name: Set info
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "TAG=$VERSION-stable" >> $GITHUB_ENV
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG%-*}"
            echo "TAG=$TAG" >> $GITHUB_ENV
          fi
          echo "DEB_ASSET=wireguard-gui_${VERSION}_${{ matrix.deb_arch }}.deb" \
            >> $GITHUB_ENV

      - name: Check gh auth
        run: gh auth status

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.gnome.Platform//46 org.gnome.Sdk//46

      # The deb comes from the Draft stable / Draft stable ARM workflows, which
      # run in parallel with this one. Wait for the asset rather than assuming
      # an ordering.
      #
      # Whatever the lookup actually returns is echoed, so a failure here says
      # why instead of only saying that it timed out.
      - name: Wait for the deb asset
        run: |
          for attempt in $(seq 1 40); do
            present=$(gh release view "$TAG" --json assets \
              --jq '.assets[].name' 2>&1 || true)

            if printf '%s\n' "$present" | grep -qx "$DEB_ASSET"; then
              echo "Found $DEB_ASSET after $attempt attempt(s)"
              exit 0
            fi

            echo "Attempt $attempt: $DEB_ASSET not attached yet."
            echo "  lookup returned:"
            printf '%s\n' "$present" | sed 's/^/    /'
            sleep 30
          done
          echo "::error::$DEB_ASSET never appeared on release $TAG"
          exit 1

      - name: Download the deb
        run: |
          gh release download "$TAG" \
            -p "$DEB_ASSET" -D flatpak --clobber
          mv "flatpak/$DEB_ASSET" flatpak/wireguard-gui.deb
          ls -lh flatpak/wireguard-gui.deb
          file flatpak/wireguard-gui.deb

      - name: Build flatpak
        run: |
          flatpak-builder --force-clean --repo=repo \
            build-dir flatpak/com.wireguard-gui.io.yml

      # The GNOME runtime does not carry every library the deb links against.
      # Rather than guessing the list, report it: anything printed here as "not
      # found" has to become an extra module in the manifest.
      - name: Report unresolved shared libraries
        if: always()
        run: |
          echo "=== ldd /app/bin/wireguard-gui inside the build sandbox ==="
          flatpak-builder --run build-dir flatpak/com.wireguard-gui.io.yml \
            ldd /app/bin/wireguard-gui > ldd.txt 2>&1 || true
          cat ldd.txt
          echo
          if grep -q 'not found' ldd.txt; then
            echo "::warning::Unresolved libraries — add these to the manifest:"
            grep 'not found' ldd.txt
          else
            echo "All shared libraries resolved."
          fi

      - name: Bundle flatpak
        run: |
          flatpak build-bundle repo \
            "wireguard-gui_${{ matrix.arch }}.flatpak" com.wireguard-gui.io
          ls -lh "wireguard-gui_${{ matrix.arch }}.flatpak"

      - name: Upload flatpak as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-gui-${{ matrix.arch }}-flatpak
          path: wireguard-gui_${{ matrix.arch }}.flatpak
          if-no-files-found: error

      - name: Attach flatpak to release
        if: github.event_name == 'push'
        run: |
          gh release upload --clobber \
            "$TAG" \
            "wireguard-gui_${{ matrix.arch }}.flatpak"
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN || github.token }}
