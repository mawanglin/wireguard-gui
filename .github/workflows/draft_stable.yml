name: Draft stable

on:
  push:
    # Tag form: <version>-<channel>, e.g. 0.1.13-stable
    tags:
      - '*-stable'
    # Kept for the original branch-driven flow
    branches:
      - 'release/stable/**'
  pull_request:
    branches:
      - 'release/stable/**'
    types: [opened, synchronize]

env:
  CARGO_TERM_COLOR: always

jobs:
  draft_stable:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      # Extract channel and version from either a tag (0.1.13-stable)
      # or a release branch (release/stable/0.1.13)
      - name: Set info
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "VERSION=${TAG%-*}" >> $GITHUB_ENV
            echo "CHANNEL=${TAG##*-}" >> $GITHUB_ENV
          else
            echo "CHANNEL=$(echo ${GITHUB_REF} | awk -F/ '{print $4}')" >> $GITHUB_ENV
            echo "VERSION=$(echo ${GITHUB_REF} | awk -F/ '{print $5}')" >> $GITHUB_ENV
          fi
      # Print info for debug
      - name: Print Info
        run: |
          echo $GITHUB_REF
          echo $CHANNEL
          echo $VERSION

      # Bundle file names are derived from tauri.conf.json. If the ref disagrees
      # with it, the mismatch would only surface as a "file not found" on upload,
      # after a full release build. Fail immediately instead.
      - name: Check ref version matches tauri.conf.json
        run: |
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$CONF_VERSION" != "$VERSION" ]; then
            echo "::error::Version mismatch: ref says '$VERSION', tauri.conf.json says '$CONF_VERSION'"
            exit 1
          fi
          echo "Version $VERSION matches tauri.conf.json"

      # Cache Rust
      - uses: actions/cache@v6
        with:
          path: ./src-tauri/target
          key: ubuntu-x86_64${{ hashFiles('./src-tauri/Cargo.lock') }}

      # Cache Rust
      - uses: actions/cache@v6
        with:
          path: ~/.cargo
          key: ubuntu-x86_64${{ hashFiles('./src-tauri/Cargo.lock') }}

      # Cache Node
      - uses: actions/cache@v6
        with:
          path: ./node_modules
          key: ubuntu-x86_64${{ hashFiles('./package-lock.json') }}

      # Cache Next.js
      - uses: actions/cache@v6
        with:
          path: ./src-next/.next
          key: ubuntu-x86_64${{ hashFiles('./src-next/package-lock.json') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev libudev-dev patchelf \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2

      - name: Install node dependencies
        run: npm install --legacy-peer-deps

      - name: Build application
        run: npm run tauri build

      # RPM file names follow a different convention from deb
      # (wireguard-gui-0.1.13-1.x86_64.rpm), so resolve the path instead of
      # spelling it out. Also prints everything that was produced, which makes
      # a missing bundle obvious in the log.
      - name: Locate bundles
        run: |
          BUNDLE_DIR=./src-tauri/target/release/bundle
          echo "Produced bundles:"
          find "$BUNDLE_DIR" -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -printf '  %p\n'
          RPM_PATH=$(find "$BUNDLE_DIR/rpm" -maxdepth 1 -type f -name '*.rpm' | head -n 1)
          if [ -z "$RPM_PATH" ]; then
            echo "::error::No RPM found under $BUNDLE_DIR/rpm"
            exit 1
          fi
          echo "RPM_PATH=$RPM_PATH" >> $GITHUB_ENV

      - name: Test if release already exists
        id: release-exists
        continue-on-error: true
        run: gh release view $VERSION-$CHANNEL
        env:
          GITHUB_TOKEN: ${{ secrets.CI_TOKEN }}
      - name: Create draft release
        if: steps.release-exists.outcome == 'failure' && steps.release-exists.conclusion == 'success'
        run: |
          gh release create -d \
            $VERSION-$CHANNEL \
            -t $VERSION-$CHANNEL \
            -F ./CHANGELOG.md \
            ./src-tauri/target/release/bundle/deb/wireguard-gui_${VERSION}_amd64.deb#wireguard-gui_amd64.deb \
            "${RPM_PATH}#wireguard-gui_amd64.rpm" \
            ./src-tauri/target/release/bundle/appimage/wireguard-gui_${VERSION}_amd64.AppImage#wireguard-gui_amd64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.CI_TOKEN }}
      # --clobber overwrites assets in place. The previous delete-then-upload
      # pair could never work: assets are stored under the name after '#'
      # (wireguard-gui_amd64.deb), but delete-asset was passed the pre-rename
      # name, so the delete silently no-opped and the upload then failed on a
      # duplicate asset name.
      - name: Update draft release
        if: steps.release-exists.outcome == 'success' && steps.release-exists.conclusion == 'success'
        run: |
          gh release upload --clobber \
            $VERSION-$CHANNEL \
            ./src-tauri/target/release/bundle/deb/wireguard-gui_${VERSION}_amd64.deb#wireguard-gui_amd64.deb \
            "${RPM_PATH}#wireguard-gui_amd64.rpm" \
            ./src-tauri/target/release/bundle/appimage/wireguard-gui_${VERSION}_amd64.AppImage#wireguard-gui_amd64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.CI_TOKEN }}
